<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle + ' | Expense Tracker'}">Expense Form</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/dashboard}">
        <span class="brand-mark">ET</span>
        <span>Expense Tracker</span>
    </a>
    <a class="btn ghost small" th:href="@{/dashboard}">Back to Dashboard</a>
</header>

<main class="form-shell">
    <section class="panel form-panel">
        <p class="eyebrow">EXPENSE CRUD</p>
        <h1 th:text="${pageTitle}">Add Expense</h1>
        <p class="muted">Fill in the details below and save the record.</p>

        <form class="form-stack spaced" th:action="${formAction}" th:object="${expenseRequest}" method="post">
            <div>
                <label for="title">Title</label>
                <input id="title" type="text" th:field="*{title}" placeholder="Example: Lunch">
                <small class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small>
            </div>

            <div class="two-col-form">
                <div>
                    <label for="amount">Amount (৳)</label>
                    <input id="amount" type="number" step="0.01" min="0.01" th:field="*{amount}" placeholder="0.00">
                    <small class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></small>
                </div>
                <div>
                    <label for="date">Expense date</label>
                    <input id="date" type="date" th:field="*{expenseDate}">
                    <small class="field-error" th:if="${#fields.hasErrors('expenseDate')}" th:errors="*{expenseDate}"></small>
                </div>
            </div>

            <div>
                <label for="category">Category</label>
                <select id="category" th:field="*{category}">
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Health">Health</option>
                    <option value="Education">Education</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
                <small class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></small>
            </div>

            <div>
                <label for="note">Note</label>
                <textarea id="note" rows="4" th:field="*{note}" placeholder="Optional details"></textarea>
                <small class="field-error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></small>
            </div>

            <div class="form-actions">
                <a class="btn ghost" th:href="@{/dashboard}">Cancel</a>
                <button class="btn primary" type="submit" th:text="${submitText}">Save Expense</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
