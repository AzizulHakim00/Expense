services:
  - type: web
    name: expense-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: expense_db
      - key: THYMELEAF_CACHE
        value: "true"
