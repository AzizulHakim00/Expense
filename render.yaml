services:
  - type: web
    name: expense-tracker-azizul
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: mission_db
      - key: THYMELEAF_CACHE
        value: "true"
